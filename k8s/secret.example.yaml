# Example only. In production, source these from a secret manager (External Secrets Operator,
# Vault, AWS/GCP/Azure secret stores) rather than committing a Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: careagents-secrets
type: Opaque
stringData:
  CA_LLM_API_KEY: "replace-me"
  CA_DATABASE_URL: "postgresql://careagents:replace-me@pgbouncer:6432/careagents?sslmode=require"
  CA_REDIS_URL: "rediss://:replace-me@redis:6379/0"
  CA_JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    replace-with-your-idp-signing-key
    -----END PUBLIC KEY-----
