# Only the ingress controller reaches the API; only Prometheus reaches /metrics on the pod port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: careagents-api
spec:
  podSelector:
    matchLabels: {app: careagents, component: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8000}]
